<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img">
<title>Got a job for an agent? Let's talk — me@lordamdal.com, @theamdal on X</title>
<defs>
<filter id="edge" x="-25%" y="-25%" width="150%" height="150%">
  <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="11" result="t"/>
  <feDisplacementMap in="SourceGraphic" in2="t" scale="17" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
  <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="4" result="t"/>
  <feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="torn" x="-10%" y="-30%" width="120%" height="160%">
  <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7" result="t"/>
  <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.066  0 0 0 0 0.05  0.22 0 0 0 -0.08"/>
</filter>
<clipPath id="clip"><rect x="1.5" y="1.5" width="1197" height="337" rx="18"/></clipPath></defs>
<style>
.sans { font-family: 'Helvetica Neue', Helvetica, Inter, 'Segoe UI', Arial, sans-serif; }
.mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
.pre { white-space: pre; }
@keyframes in { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="340" fill="#14110d"/>

<g transform="translate(860 -40) scale(0.8)" opacity="0.95">
<path d="M300 44 C400 8 530 52 580 148 C632 248 618 372 528 448 C438 524 300 540 206 486 C104 428 44 316 62 208 C80 100 196 82 300 44 Z" fill="#efb63d" opacity=".82" filter="url(#soft)"/>
<path d="M336 132 C412 108 486 158 502 236 C520 320 470 396 392 420 C310 446 224 404 202 330 C180 254 240 162 336 132 Z" fill="#e2603c" opacity=".8" filter="url(#edge)"/>
<path d="M360 190 C420 176 470 214 474 266 C478 322 436 360 380 362 C322 364 290 322 292 272 C294 226 318 200 360 190 Z" fill="#cd4f7c" opacity=".7" filter="url(#edge)"/>
</g>
<g transform="rotate(-1.5 64 52)">
<rect x="64" y="52" width="186" height="36" fill="none" stroke="#efb63d" stroke-width="2.5"/>
<text x="81" y="75" class="mono" font-size="13" font-weight="700" letter-spacing="3" fill="#efb63d">02 / SAY HELLO</text>
</g>
<text id="f1" x="60" y="172" class="sans" font-size="60" font-weight="900" letter-spacing="-2.70" fill="#fbf8f1" textLength="764.7" lengthAdjust="spacingAndGlyphs">GOT A JOB FOR AN AGENT?</text>
<rect x="50" y="198" width="344" height="56" fill="#efb63d" filter="url(#torn)"/><text id="f2" x="60" y="246" class="sans" font-size="60" font-weight="900" letter-spacing="-2.70" fill="#14110d" textLength="321.5" lengthAdjust="spacingAndGlyphs">LET'S TALK.</text>
<text x="62" y="300" class="mono" font-size="14" font-weight="700" letter-spacing="2.4" fill="#efb63d"><tspan dx="0">ME@LORDAMDAL.COM</tspan><tspan dx="22">✦</tspan><tspan dx="22">@THEAMDAL ON X</tspan><tspan dx="22">✦</tspan><tspan dx="22">IN/LORDAMDAL</tspan></text>

<rect width="1200" height="340" filter="url(#grain)"/>
</g>
<rect x="1.5" y="1.5" width="1197" height="337" rx="18" fill="none" stroke="#14110d" stroke-width="3"/>
</svg>

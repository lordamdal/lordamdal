<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img">
<title>End of drawing set. Questions: me@lordamdal.com</title>
<defs>
<pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#fff" stroke-opacity=".09"/></pattern>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#e6eefa" stroke-opacity=".3" stroke-width="1.5"/></pattern>
<radialGradient id="vignette" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#1a4a78" stop-opacity=".5"/><stop offset="1" stop-color="#05121f" stop-opacity=".55"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 Z" fill="#e6eefa"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 Z" fill="#ff6b5b"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 Z" fill="#ffb547"/></marker>
<clipPath id="clip"><rect width="1200" height="104" rx="14"/></clipPath></defs>
<style>
.din { font-family: 'DIN Alternate', 'DIN Condensed', Bahnschrift, 'D-DIN', 'Barlow Semi Condensed', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 700; }
.mono { font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
.sans { font-family: 'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif; }
.flow { stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -13; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { display: none; } }
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="104" fill="#0f2d4a"/>
<rect width="1200" height="104" fill="url(#minor)"/>
<rect width="1200" height="104" fill="url(#major)"/>
<rect width="1200" height="104" fill="url(#vignette)"/>
<rect x="12" y="12" width="1176" height="80" fill="none" stroke="#e6eefa" stroke-width="2"/><rect x="32" y="32" width="1136" height="40" fill="none" stroke="#e6eefa" stroke-width="1" stroke-opacity=".8"/>
<text x="60" y="60" class="mono" font-size="13" fill="#8eaacb" letter-spacing="2.2" xml:space="preserve">END OF DRAWING SET  ·  05 SHEETS</text>
<text x="1140" y="60" class="mono" font-size="15" fill="#e6eefa" text-anchor="end" letter-spacing="1.6">QUESTIONS <tspan fill="#ffb547">→</tspan> ME@LORDAMDAL.COM</text>

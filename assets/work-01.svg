.bold { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
.mono { font-family: 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; }
</style>
<rect x="12" y="12" width="1200" height="500" rx="20" fill="#141414"/>
<g clip-path="url(#wall)">
<rect width="1200" height="500" fill="#ffd21f"/>


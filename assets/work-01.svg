<text x="564" y="308" class="sans" font-size="20" fill="#141414">Claude, driving the Chrome you're already</text><text x="564" y="336" class="sans" font-size="20" fill="#141414">logged into — real clicks, real typing, and</text><text x="564" y="364" class="sans" font-size="20" fill="#141414">nothing irreversible without your click.</text>
